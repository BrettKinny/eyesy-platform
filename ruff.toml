line-length = 110
target-version = "py39"
# The CLI is a Python script without a .py extension.
extend-include = ["eyesyctl"]
# Retiring separately; keep it out of lint and format checks.
extend-exclude = ["tests/test_milkdrop_evaluator.py"]

[lint]
select = ["E4", "E7", "E9", "F"]

[format]
# Format Python only; Markdown code samples are prose.
exclude = ["*.md"]
